<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="tb-blurple-grad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7983f5"/>
      <stop offset="50%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#4752c4"/>
    </linearGradient>
    <linearGradient id="shield-rim-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(121, 131, 245, 0.6)"/>
      <stop offset="100%" stop-color="rgba(71, 82, 196, 0.2)"/>
    </linearGradient>
    <filter id="beacon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Discord Charcoal Shield -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#1e1f22" stroke="url(#shield-rim-grad)" stroke-width="1.5"/>
  <!-- Glowing central beacon heart / shield emblem in Discord blurple -->
  <path d="M24 13 C19.5 8.5, 10.5 10.5, 10.5 17.5 C10.5 24.5, 24 35, 24 35 C24 35, 37.5 24.5, 37.5 17.5 C37.5 10.5, 28.5 8.5, 24 13 Z" fill="url(#tb-blurple-grad)" filter="url(#beacon-glow)"/>
  <!-- Central authentic ray -->
  <circle cx="24" cy="20.5" r="3.5" fill="#ffffff" opacity="0.95"/>
  <line x1="24" y1="11.5" x2="24" y2="8.5" stroke="#d5d8fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="14.5" x2="13" y2="12.5" stroke="#d5d8fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="14.5" x2="35" y2="12.5" stroke="#d5d8fc" stroke-width="2" stroke-linecap="round"/>
</svg>
