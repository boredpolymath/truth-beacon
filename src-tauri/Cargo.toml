[package]
name = "truth-beacon"
version = "0.1.5"
description = "TruthBeacon: Desktop Identity Ground-Truth & Impersonation Prevention Console"
authors = ["Orange Heart Industries"]
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "truth-beacon"

[lib]
name = "truth_beacon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
strsim = "0.11"
unicode-normalization = "0.1"
deunicode = "1.6"
image = "0.25"
img_hash = "3.2"
ring = "0.17"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
libc = "0.2"
tauri-plugin-updater = "2.13.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
