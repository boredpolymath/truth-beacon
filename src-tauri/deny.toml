# cargo-deny configuration for TruthBeacon
# Prepared by Orange Heart Industries &bull; Clean Single-Binary Licensing Standard

[graph]
targets = [
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "NCSA",
    "MPL-2.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
]

# Clarifications for packages with dual or non-standard license expressions
[[licenses.clarify]]
name = "r-efi"
expression = "MIT OR Apache-2.0"
license-files = [{ path = "LICENSE-MIT", hash = 0xbd1e54a0 }]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd1e54a0 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
ignore = [
    # RUSTSEC-2023-0080: transpose 0.1.0 integer overflow vulnerability inside rustfft v3.0.1 -> rustdct v0.4.0 -> img_hash.
    # Exploitation requires huge slices overflowing usize; TruthBeacon uses fixed 8x8 (64-pixel) perceptual hashes.
    "RUSTSEC-2023-0080",
    # Unmaintained informational notices for transitive build dependencies in Tauri/image tree:
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2024-0370", # proc-macro-error
]

