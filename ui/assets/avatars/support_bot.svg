<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#3b429f"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg-bot)"/>
  <!-- Bot Body -->
  <rect x="25" y="32" width="50" height="42" rx="14" fill="#2b2d31" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Antenna -->
  <line x1="50" y1="32" x2="50" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="18" r="5" fill="#f97316"/>
  <!-- Bot Screen/Eyes -->
  <rect x="33" y="42" width="34" height="18" rx="6" fill="#1e1f22"/>
  <circle cx="43" cy="51" r="4" fill="#38bdf8"/>
  <circle cx="57" cy="51" r="4" fill="#38bdf8"/>
  <!-- Cheerful Smile -->
  <path d="M44 65 Q50 69 56 65" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Ears / Bolts -->
  <rect x="20" y="47" width="5" height="12" rx="2" fill="#5865f2"/>
  <rect x="75" y="47" width="5" height="12" rx="2" fill="#5865f2"/>
</svg>
