<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="oh-beacon-grad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="beacon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background subtle shield -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Glowing central beacon heart -->
  <path d="M24 14 C20 9, 11 11, 11 18 C11 25, 24 35, 24 35 C24 35, 37 25, 37 18 C37 11, 28 9, 24 14 Z" fill="url(#oh-beacon-grad)" filter="url(#beacon-glow)"/>
  <!-- Central authentic ray -->
  <circle cx="24" cy="21" r="3.5" fill="#ffffff" opacity="0.95"/>
  <line x1="24" y1="12" x2="24" y2="9" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="15" x2="13" y2="13" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="15" x2="35" y2="13" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>
</svg>
